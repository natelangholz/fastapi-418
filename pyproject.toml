[project]
name = "fastapi-418"
version = "0.1.0"
description = "FastAPI and Jupyter recreation of the plumber-api-418 project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "jupyter>=1.0.0",
  "notebook>=7.0.0",
  "matplotlib>=3.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"